name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: price_oracle
          POSTGRES_PASSWORD: price_oracle
          POSTGRES_DB: price_oracle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U price_oracle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://price_oracle:price_oracle@localhost:5432/price_oracle
      REDIS_URL: redis://localhost:6379/0
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install --no-cache-dir "./backend[dev]"

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend production image
        run: docker build -f backend/Dockerfile.prod -t price-oracle-backend:ci .

      - name: Build worker production image
        run: docker build -f worker/Dockerfile.prod -t price-oracle-worker:ci .

      - name: Build frontend production image
        run: |
          docker build -f frontend/Dockerfile.prod \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 \
            -t price-oracle-frontend:ci frontend
